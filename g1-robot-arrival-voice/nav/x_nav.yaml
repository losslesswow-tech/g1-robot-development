      rostopic: /livox/lidar
    cam0:
      T_lidar_cam:    
        [ 0.662709,  -0.748649,  -0.018507, 0.007756,
          0.274071,   0.265461,  -0.924346, -0.034459,
          0.696924,   0.607500,   0.381106, -0.029423,
