      undistort_rostopic_out: /fisheye/left/image_rect
      undistort_compressed_rostopic_out: /fisheye/left/image_rect/compressed

    cam1:
      T_lidar_cam:    
        [ -0.730522,  -0.682757,  -0.013403, 0.022679,
              0.256355,  -0.255992,  -0.932068, -0.031377,
              0.632945,  -0.684332,   0.362036, -0.037197,
            0.0,   0.0,    0.0,    1.0]
      distortion_coeffs: [0.061737, 0.030631, -0.018546, 0.003310]
      intrinsics: [443.914507, 444.570468, 957.8366089488175, 613.101509] # fx fy cx cy
      resolution: [1920, 1200]

      intrinsics_out: [300, 300, 480, 300]
      resolution_out: [960, 600]

      rostopic: /fisheye/right/image_raw
      undistort_rostopic_out: /fisheye/right/image_rect
      undistort_compressed_rostopic_out: /fisheye/right/image_rect/compressed






