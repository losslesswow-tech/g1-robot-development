services:
  g1-bridge:
    container_name: g1-bridge-safe
    image: g1-bridge:arm64
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    network_mode: host
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
      - /root/.ros
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ROS_MASTER_URI: "${ROS_MASTER_URI:-http://192.0.2.6:11311}"
      ROS_IP: "${ROS_IP:-192.0.2.8}"
      DDS_INTERFACE: "${DDS_INTERFACE:-eth0}"
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      ENABLE_MOTION: "${ENABLE_MOTION:-false}"
      AUTO_START: "${AUTO_START:-false}"
      MOTION_LOCKED: "${MOTION_LOCKED:-true}"
      DEPLOYMENT_MODE: "${DEPLOYMENT_MODE:-external_navigation}"
      REQUIRE_ROS_MASTER: "${REQUIRE_ROS_MASTER:-true}"
      ROS_MASTER_CHECK_TIMEOUT_SEC: "${ROS_MASTER_CHECK_TIMEOUT_SEC:-3}"
    healthcheck:
      test: ["CMD", "/usr/local/bin/g1-bridge-healthcheck"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
